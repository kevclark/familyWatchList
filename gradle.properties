# agent101 has 16GB RAM and also has to host the emulator — keep the daemon boxed in.
# See PLAN.md §8: never run a full build and an emulator first-boot at the same time.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
